plugins { id 'com.android.application' }
android {
    namespace 'com.ylports.aseprite'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.ylports.aseprite'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1-portrait-dev'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }
}
// Never package an empty or reconstructed editor in place of real Aseprite.
tasks.named('preBuild') {
    doFirst {
        if (!file('src/main/jniLibs/arm64-v8a/libaseprite.so').isFile())
            throw new GradleException('Missing real original Aseprite libaseprite.so')
        if (!file('src/main/assets/data/gui.xml').isFile())
            throw new GradleException('Missing original Aseprite data/gui.xml')
    }
}
