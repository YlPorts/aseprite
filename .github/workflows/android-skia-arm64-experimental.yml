name: Android ARM64 original Skia and Aseprite link (experimental)
on:
  workflow_dispatch:
  push:
    branches: [android-native-port-wip]
    paths:
      - '.github/workflows/android-skia-arm64-experimental.yml'
      - 'android-port/scripts/try-build-original-editor-arm64.sh'
      - 'android-port/scripts/patch-laf-android-raster.py'
      - 'android-port/scripts/patch-laf-android-runtime.py'
      - 'android-port/docs/BUILD_ANDROID.md'

jobs:
  original-aseprite-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Fetch authentic Aseprite and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3
      - name: Install pinned NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang python3 git cmake pkg-config \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libfontconfig1-dev \
            libfreetype-dev libharfbuzz-dev libpng-dev zlib1g-dev
      - name: Clone Skia m124 and depot_tools
        run: |
          mkdir -p build
          git clone --depth 1 -b aseprite-m124 https://github.com/aseprite/skia.git build/skia
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git build/depot_tools
      - name: Sync original Skia dependencies
        working-directory: build/skia
        run: |
          export PATH="$GITHUB_WORKSPACE/build/depot_tools:$PATH"
          python3 tools/git-sync-deps
          python3 bin/fetch-ninja
          command -v gn
      - name: Configure genuine Android ARM64 Skia CPU raster
        working-directory: build/skia
        run: |
          export PATH="$GITHUB_WORKSPACE/build/depot_tools:$PATH"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -d "$NDK"
          ARGS="is_debug=false is_official_build=false target_os=\"android\" target_cpu=\"arm64\" ndk=\"$NDK\" ndk_api=26 skia_enable_gpu=false skia_enable_graphite=false skia_use_gl=false skia_use_system_expat=false skia_use_system_icu=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_freetype=true skia_use_harfbuzz=true skia_use_system_freetype2=false skia_use_system_harfbuzz=false"
          gn gen out/Release-Android-arm64 --args="$ARGS"
          grep -Eq 'target_os[[:space:]]*=[[:space:]]*"android"' out/Release-Android-arm64/args.gn
          grep -Eq 'target_cpu[[:space:]]*=[[:space:]]*"arm64"' out/Release-Android-arm64/args.gn
      - name: Compile original ARM64 Skia and modules
        working-directory: build/skia
        run: |
          ninja -C out/Release-Android-arm64 -j 2 skia modules
      - name: Verify original Skia output without uploading binaries
        run: |
          LIB="$GITHUB_WORKSPACE/build/skia/out/Release-Android-arm64"
          test -s "$LIB/libskia.a"
          test -s "$LIB/libskshaper.a"
          test -s "$LIB/libskunicode.a"
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" t "$LIB/libskia.a" > "$RUNNER_TEMP/skia-members.txt"
          sed -n '1,12p' "$RUNNER_TEMP/skia-members.txt"
      - name: Attempt authentic original editor JNI library (no APK)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ASEPRITE_ANDROID_SKIA_DIR="$GITHUB_WORKSPACE/build/skia"
          export ASEPRITE_ANDROID_SKIA_LIBS="$GITHUB_WORKSPACE/build/skia/out/Release-Android-arm64"
          bash android-port/scripts/try-build-original-editor-arm64.sh
