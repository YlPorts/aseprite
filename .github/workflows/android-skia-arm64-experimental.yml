name: Build original Skia m124 for Android ARM64 (experimental)
on:
  workflow_dispatch:
  push:
    branches: [android-native-port-wip]
    paths:
      - '.github/workflows/android-skia-arm64-experimental.yml'
      - 'android-port/docs/BUILD_ANDROID.md'

jobs:
  skia-android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out port metadata (not an Aseprite binary)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned Android NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang python3 git
      - name: Retrieve authentic Aseprite Skia branch and depot_tools
        run: |
          mkdir -p build
          git clone --depth 1 -b aseprite-m124 https://github.com/aseprite/skia.git build/skia
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git build/depot_tools
      - name: Synchronize genuine Skia third-party dependencies
        working-directory: build/skia
        run: |
          export PATH="$GITHUB_WORKSPACE/build/depot_tools:$PATH"
          python3 tools/git-sync-deps
          python3 bin/fetch-ninja
      - name: Configure Android ARM64 Skia with raster backend
        working-directory: build/skia
        run: |
          export PATH="$GITHUB_WORKSPACE/build/depot_tools:$PATH"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -d "$NDK"
          ARGS="is_debug=false is_official_build=false target_os=\"android\" target_cpu=\"arm64\" ndk=\"$NDK\" ndk_api=26 skia_enable_gpu=false skia_enable_graphite=false skia_use_gl=false skia_use_system_expat=false skia_use_system_icu=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_freetype=true skia_use_harfbuzz=true skia_use_system_freetype2=false skia_use_system_harfbuzz=false"
          bin/gn gen out/Release-Android-arm64 --args="$ARGS"
      - name: Build genuine Skia and modules static libraries
        working-directory: build/skia
        run: |
          ninja -C out/Release-Android-arm64 -j 2 skia modules
      - name: Verify renderer library presence and never publish Aseprite
        run: |
          LIB=build/skia/out/Release-Android-arm64
          test -s "$LIB/libskia.a"
          test -s "$LIB/libskshaper.a"
          test -s "$LIB/libskunicode.a"
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" t "$LIB/libskia.a" > build/skia/arm64-objects.txt
          sed -n '1,12p' build/skia/arm64-objects.txt
          echo 'Standalone Skia libraries only; NO Aseprite build or APK.'
