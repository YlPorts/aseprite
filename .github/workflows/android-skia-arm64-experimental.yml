name: Android ARM64 original Skia and Aseprite link (experimental)
on:
  workflow_dispatch:
    inputs:
      build_private_apk:
        description: 'Package a personal-use development APK (private repository only; runtime unverified)'
        type: boolean
        default: false
  push:
    branches: [android-native-port-wip]
    paths:
      - '.github/workflows/android-skia-arm64-experimental.yml'
      - 'android-port/scripts/**'
      - 'android-port/app/**'
      - 'android-port/build.gradle'
      - 'android-port/settings.gradle'
      - 'android-port/native-app/**'
      - 'android-port/platform/laf/**'
      - 'android-port/src/android/**'
      - 'android-port/docs/BUILD_ANDROID.md'

permissions:
  contents: read

# Keep one active run and only the latest pending commit on this branch.
# Do not interrupt a long-running authentic ARM64 build on each source edit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-aseprite-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Enforce private-only APK packaging
        if: ${{ inputs.build_private_apk && !github.event.repository.private }}
        run: |
          echo 'Personal-use APK artifacts require a separate PRIVATE repository.' >&2
          exit 1
      - name: Fetch authentic Aseprite and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install pinned NDK using runner SDK (no obsolete tools package)
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'ndk;27.2.12479018'
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang python3 git cmake pkg-config \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libfontconfig1-dev \
            libfreetype-dev libharfbuzz-dev libpng-dev zlib1g-dev
      - name: Clone authentic Skia m124
        run: |
          mkdir -p build
          git clone --depth 1 -b aseprite-m124 https://github.com/aseprite/skia.git build/skia
          # Match the genuine m124 revision verified with the pinned LAF.
          test "$(git -C build/skia rev-parse HEAD)" = '08a5439a6be726021c1c1905d23ce298a3edc5e4'
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git submodule status --recursive >> "$GITHUB_STEP_SUMMARY"
          git -C build/skia rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Sync original Skia dependencies
        working-directory: build/skia
        run: |
          # This Skia revision fetches its pinned GN binary itself. Calling
          # depot_tools/gn instead requires an unrelated Python bootstrap.
          GIT_SYNC_DEPS_SKIP_EMSDK=1 python3 tools/git-sync-deps
          test -x bin/gn
          bin/gn --version
      - name: Configure genuine Android ARM64 Skia CPU raster
        working-directory: build/skia
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -d "$NDK"
          ARGS="is_debug=false is_official_build=false target_os=\"android\" target_cpu=\"arm64\" ndk=\"$NDK\" ndk_api=26 skia_enable_gpu=false skia_enable_graphite=false skia_use_gl=false skia_use_system_expat=false skia_use_system_icu=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_freetype=true skia_use_harfbuzz=true skia_use_system_freetype2=false skia_use_system_harfbuzz=false"
          bin/gn gen out/Release-Android-arm64 --args="$ARGS"
          grep -Eq 'target_os[[:space:]]*=[[:space:]]*"android"' out/Release-Android-arm64/args.gn
          grep -Eq 'target_cpu[[:space:]]*=[[:space:]]*"arm64"' out/Release-Android-arm64/args.gn
      - name: Compile only original ARM64 Skia, Shaper and Unicode
        working-directory: build/skia
        run: |
          # Avoid unrelated skottie, SVG and paragraph modules. The original
          # Aseprite LAF FindSkia only links these three GN libraries.
          ninja -C out/Release-Android-arm64 -j 2 skia skshaper skunicode
      - name: Verify real Android ARM64 Skia and dependency archives (NO APK)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash android-port/scripts/audit-original-skia-arm64.sh \
            "$GITHUB_WORKSPACE/build/skia/out/Release-Android-arm64"
      - name: Link and verify authentic original editor JNI library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ASEPRITE_ANDROID_SKIA_DIR="$GITHUB_WORKSPACE/build/skia"
          export ASEPRITE_ANDROID_SKIA_LIBS="$GITHUB_WORKSPACE/build/skia/out/Release-Android-arm64"
          set +e
          bash android-port/scripts/try-build-original-editor-arm64.sh 2>&1 | tee "$RUNNER_TEMP/aseprite-arm64-build.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            {
              echo '### Android ARM64 original editor: compilation failed'
              echo 'The build failed before any complete Aseprite APK was produced.'
              echo '#### Last completed original engine build stages'
              echo '```text'
              grep 'ASEPRITE_ANDROID_STAGE:' "$RUNNER_TEMP/aseprite-arm64-build.log" | tail -8 || true
              echo '```'
              echo '#### First compiler/configuration errors'
              echo '```text'
              grep -Em 15 'CMake Error|error:|undefined reference|FAILED:|FATAL_ERROR|not found|No such file' "$RUNNER_TEMP/aseprite-arm64-build.log" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$result"
          fi
          echo 'Original Aseprite ARM64 shared-library linkage completed (APK/device testing still required).' >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Java for personal-use Android packaging
        if: ${{ inputs.build_private_apk && github.event.repository.private }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up existing Android Gradle project
        if: ${{ inputs.build_private_apk && github.event.repository.private }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Package genuine engine and original resources for private testing
        if: ${{ inputs.build_private_apk && github.event.repository.private }}
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          python3 android-port/scripts/stage-authentic-android-assets.py \
            --engine build/aseprite-gui-android-arm64/lib/libaseprite.so
          gradle -p android-port --no-daemon --max-workers 2 assembleDebug
          APK=android-port/app/build/outputs/apk/debug/app-debug.apk
          python3 android-port/scripts/verify-original-android-apk.py "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          sha256sum "$APK" >> "$GITHUB_STEP_SUMMARY"
          echo 'Private development APK packaged. Original GUI/device functionality has NOT been validated.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain personal-use development APK only in private repository
        if: ${{ inputs.build_private_apk && github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-arm64-development-RUNTIME-UNVERIFIED
          path: android-port/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
