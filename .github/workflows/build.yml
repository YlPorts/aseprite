name: Aseprite Windows x64 personal

on:
  push:
    branches: ['build/windows-x64-personal']
    paths: ['.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aseprite-windows-personal
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Obtain source and recursive dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Obtain matching official Skia
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = (Get-Content laf/misc/skia-tag.txt -Raw).Trim()
          if ($tag -notmatch '^[a-zA-Z0-9._-]+$') { throw 'Invalid Skia release tag' }
          $url = "https://github.com/aseprite/skia/releases/download/$tag/Skia-Windows-Release-x64.zip"
          curl.exe --fail --location --retry 3 --output skia.zip $url
          if ($LASTEXITCODE -ne 0) { throw 'Skia download failed' }
          Expand-Archive skia.zip -DestinationPath skia
          if (!(Test-Path skia/out/Release-x64/skia.lib)) { throw 'Missing Skia x64 library' }

      - name: Compile Windows GUI with MSVC x64
        shell: cmd
        run: |
          @echo off
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -version "[17.0,18.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          set "PATH=%VSROOT%\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja;%PATH%"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DENABLE_TESTS=OFF -DENABLE_CCACHE=OFF -DENABLE_SCRIPTING=ON -DLAF_BACKEND=skia "-DSKIA_DIR=%CD%\skia" "-DSKIA_LIBRARY_DIR=%CD%\skia\out\Release-x64" "-DSKIA_LIBRARY=%CD%\skia\out\Release-x64\skia.lib"
          if errorlevel 1 exit /b 1
          cmake --build build --target aseprite --parallel 4
          if errorlevel 1 exit /b 1
          build\bin\aseprite.exe --batch --version
          if errorlevel 1 exit /b 1

      - name: Test sprite creation and PNG export
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          local s = Sprite(16, 16, ColorMode.RGB)
          s.cels[1].image:drawPixel(0, 0, app.pixelColor.rgba(255, 0, 0, 255))
          s:saveAs("smoke-test.aseprite")
          s:saveCopyAs("smoke-test.png")
          s:close()
          '@ | Set-Content smoke-test.lua -Encoding utf8
          & build/bin/aseprite.exe --batch --script smoke-test.lua
          if ($LASTEXITCODE -ne 0) { throw 'Aseprite export test failed' }
          foreach ($f in @('smoke-test.aseprite', 'smoke-test.png')) {
            if (!(Test-Path $f) -or (Get-Item $f).Length -lt 20) { throw "Invalid export: $f" }
          }

      - name: Package program, resources, and runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force package/Aseprite | Out-Null
          Copy-Item build/bin/* package/Aseprite -Recurse -Force
          Get-ChildItem package/Aseprite -Recurse -File -Include *.pdb,*.lib,*.exp | Remove-Item -Force
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC" -Recurse -Directory -Filter Microsoft.VC143.CRT | Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -ne $crt) { Copy-Item "$($crt.FullName)/*.dll" package/Aseprite -Force }
          foreach ($f in (Get-ChildItem -File LICENSE*,EULA*)) { Copy-Item $f.FullName package/Aseprite -Force }
          $version = & build/bin/aseprite.exe --batch --version
          if ($LASTEXITCODE -ne 0) { throw 'Version check failed' }
          @{
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            version = "$version"
            architecture = 'Windows x64'
            tests = @('Executable version', 'Lua sprite creation', 'ASEPRITE save', 'PNG export')
            exe_sha256 = (Get-FileHash package/Aseprite/aseprite.exe -Algorithm SHA256).Hash
          } | ConvertTo-Json | Set-Content package/Aseprite/BUILD-INFO.json -Encoding utf8
          "Extrae toda la carpeta y abre aseprite.exe. Conserva la carpeta data y los DLL junto al ejecutable. Compilacion personal no oficial; no es un instalador." | Set-Content package/Aseprite/LEEME.txt -Encoding utf8
          Copy-Item smoke-test.png,smoke-test.aseprite package/Aseprite
          Compress-Archive -Path package/Aseprite -DestinationPath Aseprite-Windows-x64-personal.zip -CompressionLevel Optimal

      - name: Encrypt personal delivery before artifact upload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Only the public delivery key is committed. The private key remains with the requester.
          $rsa = [System.Security.Cryptography.RSA]::Create()
          $rsa.FromXmlString('<RSAKeyValue><Modulus></Modulus><Exponent>AQAB</Exponent></RSAKeyValue>')
          $key = [System.Security.Cryptography.RandomNumberGenerator]::GetBytes(32)
          $nonce = [System.Security.Cryptography.RandomNumberGenerator]::GetBytes(12)
          $plain = [System.IO.File]::ReadAllBytes((Join-Path $pwd 'Aseprite-Windows-x64-personal.zip'))
          $cipher = [byte[]]::new($plain.Length)
          $tag = [byte[]]::new(16)
          $aes = [System.Security.Cryptography.AesGcm]::new($key, 16)
          $aes.Encrypt($nonce, $plain, $cipher, $tag)
          $wrappedKey = $rsa.Encrypt($key, [System.Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
          New-Item -ItemType Directory -Force personal-delivery | Out-Null
          [System.IO.File]::WriteAllBytes((Join-Path $pwd 'personal-delivery/program.aesgcm'), $cipher)
          @{
            format = 'aseprite-personal-rsa3072-aes256gcm-v1'
            encrypted_key = [Convert]::ToBase64String($wrappedKey)
            nonce = [Convert]::ToBase64String($nonce)
            tag = [Convert]::ToBase64String($tag)
            zip_sha256 = (Get-FileHash Aseprite-Windows-x64-personal.zip -Algorithm SHA256).Hash
          } | ConvertTo-Json | Set-Content personal-delivery/envelope.json -Encoding utf8
          $aes.Dispose()
          $rsa.Dispose()

      - name: Save encrypted personal build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Aseprite-Windows-x64-personal-encrypted
          path: personal-delivery/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
