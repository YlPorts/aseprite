name: Android native core alpha
on:
  push:
    branches: ['android/native-core']
    paths: ['android/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aseprite-android-core
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Native toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake zlib1g-dev
      - name: Compile and test the original document engine on Linux
        run: |
          cmake -S android/app/src/main/cpp -B build-mobile-tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build-mobile-tests --target core-tests --parallel 4
          ctest --test-dir build-mobile-tests --output-on-failure
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
      - name: Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Include upstream component notices
        run: |
          mkdir -p android/app/src/main/assets/licenses
          for pair in 'src/doc/LICENSE.txt:doc.txt' 'src/render/LICENSE.txt:render.txt' 'src/dio/LICENSE.txt:dio.txt' 'laf/LICENSE.txt:laf.txt' 'src/flic/LICENSE.txt:flic.txt' 'third_party/cityhash/COPYING:cityhash.txt' 'third_party/pixman/COPYING:pixman.txt' 'third_party/fmt/LICENSE:fmt.txt'; do
            src="${pair%%:*}"; dst="${pair#*:}"
            if test -f "$src"; then cp "$src" "android/app/src/main/assets/licenses/$dst"; fi
          done
      - name: Build Android ARM64 APK
        run: gradle -p android :app:assembleDebug --stacktrace --no-daemon
      - name: Verify signature and native architecture
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -p "$APK" lib/arm64-v8a/libaseprite_android.so > /tmp/libaseprite_android.so
          readelf -h /tmp/libaseprite_android.so | grep AArch64
          readelf -l /tmp/libaseprite_android.so
          mkdir delivery
          cp "$APK" delivery/Aseprite-Core-Android-arm64-alpha.apk
          cp android/README.md delivery/LEEME.md
          sha256sum delivery/*.apk > delivery/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Aseprite-Android-Core-Alpha
          path: delivery/
          if-no-files-found: error
          retention-days: 7
