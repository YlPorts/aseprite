name: Personal artifact delivery check
on:
  push:
    branches: ['build/windows-x64-personal']
    paths: ['.github/workflows/personal-delivery-check.yml']
permissions:
  contents: read
jobs:
  delivery:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Test PowerShell packaging and encryption
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force fixture,delivery-test | Out-Null
          'Aseprite personal build: encrypted delivery pipeline self-test. Not an application.' | Set-Content fixture/delivery-test.txt -Encoding utf8
          Compress-Archive fixture -DestinationPath fixture.zip -CompressionLevel Optimal
          $plain = [System.IO.File]::ReadAllBytes((Join-Path $pwd 'fixture.zip'))
          $rsa = [System.Security.Cryptography.RSA]::Create()
          $rsa.FromXmlString('<RSAKeyValue><Modulus></Modulus><Exponent>AQAB</Exponent></RSAKeyValue>')
          $key = [System.Security.Cryptography.RandomNumberGenerator]::GetBytes(32)
          $nonce = [System.Security.Cryptography.RandomNumberGenerator]::GetBytes(12)
          $tag = [byte[]]::new(16)
          $cipher = [byte[]]::new($plain.Length)
          $aes = [System.Security.Cryptography.AesGcm]::new($key, 16)
          $aes.Encrypt($nonce, $plain, $cipher, $tag)
          $roundtrip = [byte[]]::new($plain.Length)
          $aes.Decrypt($nonce, $cipher, $tag, $roundtrip)
          if ([Convert]::ToBase64String($roundtrip) -ne [Convert]::ToBase64String($plain)) { throw 'AES roundtrip failed' }
          $wrapped = $rsa.Encrypt($key, [System.Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
          if ($wrapped.Length -ne 384) { throw 'RSA key length mismatch' }
          [System.IO.File]::WriteAllBytes((Join-Path $pwd 'delivery-test/program.aesgcm'), $cipher)
          @{
            format = 'aseprite-personal-rsa3072-aes256gcm-v1'
            purpose = 'Delivery self-test only; not the application'
            encrypted_key = [Convert]::ToBase64String($wrapped)
            nonce = [Convert]::ToBase64String($nonce)
            tag = [Convert]::ToBase64String($tag)
            zip_sha256 = (Get-FileHash fixture.zip -Algorithm SHA256).Hash
          } | ConvertTo-Json | Set-Content delivery-test/envelope.json -Encoding utf8
          $aes.Dispose()
          $rsa.Dispose()
      - name: Save delivery self-test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delivery-self-test-not-the-application
          path: delivery-test/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
