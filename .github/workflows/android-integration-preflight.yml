name: Android original editor integration preflight (NO APK)
on:
  workflow_dispatch:
  push:
    branches: [android-native-port-wip]
    paths:
      - 'android-port/**'
      - '.github/workflows/android-integration-preflight.yml'

# Keep one active run and only the latest pending commit on this branch.
# Do not interrupt a long-running authentic ARM64 build on each source edit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-laf-platform-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install tools for real ELF regression fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils cmake ninja-build
      - name: Check original editor Java/JNI startup contract
        run: python3 android-port/tests/verify_android_bootstrap_contract.py
      - name: Validate patch syntax and required original sources
        run: |
          python3 -m py_compile android-port/scripts/patch-laf-headless-android.py \
            android-port/scripts/patch-laf-android-raster.py \
            android-port/scripts/patch-laf-android-runtime.py \
            android-port/scripts/patch-aseprite-android-engine.py
          test -f laf/os/skia/skia_window.cpp
          test -f src/main/main.cpp
          test -f src/app/resource_finder.cpp
          test -f android-port/native-app/CMakeLists.txt
      - name: Unit-test pinned upstream LAF overlay, re-entry and dry-run
        run: |
          python3 android-port/tests/patch_laf_integration_test.py
      - name: Reject wrong-architecture and invalid staged editor binaries
        run: |
          python3 -m py_compile android-port/scripts/stage-authentic-android-assets.py
          python3 android-port/tests/test_asset_stage.py
      - name: Apply native Android overlay to original source checkout
        run: |
          python3 android-port/scripts/patch-laf-headless-android.py .
          python3 android-port/scripts/patch-laf-android-raster.py .
          python3 android-port/scripts/patch-laf-android-runtime.py .
          python3 android-port/scripts/patch-aseprite-android-engine.py .
      - name: Verify overlays are reproducible and non-destructive
        run: |
          python3 android-port/scripts/patch-laf-headless-android.py .
          python3 android-port/scripts/patch-laf-android-raster.py .
          python3 android-port/scripts/patch-laf-android-runtime.py .
          python3 android-port/scripts/patch-aseprite-android-engine.py .
          grep -q 'SkiaWindowAndroid' laf/os/skia/skia_window.h
          grep -q 'skia/skia_window_android.cpp' laf/os/CMakeLists.txt
          grep -q 'androidUnregisterWindow(nullptr)' laf/os/skia/skia_system.h
          grep -q 'SystemAndroid' laf/os/skia/skia_system.h
          grep -q 'androidRegisterWindow' laf/os/skia/skia_window.cpp
          grep -q 'ASEPRITE_ANDROID_DATA_DIR' src/app/resource_finder.cpp
          grep -q 'android-port/native-app' CMakeLists.txt
          test -f android-port/app/src/main/java/com/ylports/aseprite/AsepriteActivity.java
          test -f android-port/src/android/jni_editor_entry.cpp
          test -z "$(find . -path './.git' -prune -o -type f -name '*.apk' -print -quit)"
      - name: Compile original LAF Android keyboard adapter on host
        run: |
          mkdir -p build/laf-android-preflight
          c++ -std=c++17 -Wall -Wextra -Werror \
            -I laf -c laf/os/android/key_state.cpp \
            -o build/laf-android-preflight/key_state.o
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -I laf android-port/tests/android_key_state_test.cpp \
            build/laf-android-preflight/key_state.o \
            -o build/laf-android-preflight/android_key_state_test
          build/laf-android-preflight/android_key_state_test
      - name: Install NDK 27.2 using runner SDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'ndk;27.2.12479018'
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Generate original Android configuration headers
        run: |
          # base/ints.h requires base/config.h generated by the original CMake.
          # Use the Android toolchain's checks, never a fabricated host header.
          cmake -S . -B build/android-integration-preflight -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_ASEPRITE_EXE=OFF \
            -DENABLE_NEWS=OFF -DENABLE_UPDATER=OFF -DENABLE_SCRIPTING=OFF \
            -DENABLE_WEBSOCKET=OFF -DENABLE_TESTS=OFF -DENABLE_WEBP=OFF \
            -DLAF_BACKEND=none -DLAF_WITH_CLIP=OFF \
            -DLAF_WITH_EXAMPLES=OFF -DLAF_WITH_TESTS=OFF
      - name: Exercise original LAF Android allocation path on host
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -DLAF_ANDROID=1 \
            -I laf -I build/android-integration-preflight/laf \
            android-port/tests/android_aligned_alloc_test.cpp \
            laf/base/memory.cpp -o build/laf-android-preflight/android_aligned_alloc_test
          build/laf-android-preflight/android_aligned_alloc_test
      - name: Cross-compile genuine LAF Android adapters (syntax only, no Skia)
        run: |
          CXX="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          test -x "$CXX"
          for src in \
            laf/base/memory.cpp \
            laf/os/android/key_state.cpp \
            laf/os/android/event_queue.cpp \
            laf/os/android/window.cpp \
            laf/os/android/screen.cpp \
            laf/os/android/window_registry.cpp \
            android-port/src/android/raster_presenter.cpp \
            android-port/src/android/android_raster_window.cpp \
            android-port/src/android/laf_event_bridge.cpp \
            android-port/src/android/jni_editor_entry.cpp
          do
            echo "Checking Android ARM64 syntax: $src"
            "$CXX" -std=c++17 -fsyntax-only \
              -DLAF_ANDROID=1 -DLAF_SKIA=0 -DSK_SUPPORT_GPU=0 \
              -I laf -I src -I build/android-integration-preflight/laf \
              -I android-port/src/android "$src"
          done
          echo "No original Skia GUI editor or APK has been linked."
      - name: Explicit unfinished-runtime notice
        run: echo "Platform overlays verified. This is NOT a compiled/working Aseprite Android APK."
